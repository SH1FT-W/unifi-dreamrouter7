block_client:
  fields:
    config_entry_id: &entry
      selector:
        config_entry:
          integration: udr7
    mac: &mac
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:
unblock_client:
  fields:
    config_entry_id: *entry
    mac: *mac
reconnect_client:
  fields:
    config_entry_id: *entry
    mac: *mac
authorize_guest:
  fields:
    config_entry_id: *entry
    mac: *mac
    minutes:
      example: 480
      selector:
        number:
          min: 1
          max: 525600
          unit_of_measurement: min
          mode: box
unauthorize_guest:
  fields:
    config_entry_id: *entry
    mac: *mac
